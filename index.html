<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aurora Focus — помодоро-таймер с анимированным северным сиянием">
  <title>Aurora Focus</title>
  <style>
    :root {
      --h1: 160;
      --h2: 200;
      --bg: #070b14;
      --fg: #eaf2ff;
      --muted: #8a97b3;
      --accent: hsl(var(--h1) 80% 60%);
      --accent2: hsl(var(--h2) 80% 60%);
    }
    body[data-mode="short"] { --h1: 200; --h2: 260; }
    body[data-mode="long"] { --h1: 280; --h2: 330; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      transition: --h1 1s;
    }
    .aurora {
      position: fixed;
      inset: -20%;
      filter: blur(70px);
      opacity: 0.55;
      pointer-events: none;
    }
    .aurora span {
      position: absolute;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      transition: background 1.2s;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(1) { top: 0; left: 5%; background: hsl(var(--h1) 85% 45%); }
    .aurora span:nth-child(2) { bottom: 0; right: 0; background: hsl(var(--h2) 85% 45%); animation-duration: 28s; animation-direction: alternate-reverse; }
    .aurora span:nth-child(3) { top: 30%; left: 35%; width: 35vmax; height: 35vmax; background: hsl(calc(var(--h1) + 40) 80% 40%); animation-duration: 18s; }
    @keyframes drift {
      from { transform: translate(-8%, -6%) scale(1); }
      to { transform: translate(10%, 8%) scale(1.25); }
    }
    .card {
      position: relative;
      width: min(92vw, 420px);
      padding: 32px 28px 28px;
      border-radius: 32px;
      background: rgba(10, 16, 30, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { margin: 0 0 20px; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .modes { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); margin-bottom: 28px; }
    .modes button {
      flex: 1;
      padding: 10px 6px;
      border: 0;
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .modes button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.14); color: var(--fg); }
    .ring { position: relative; width: 260px; height: 260px; margin: 0 auto 28px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
    .ring .track { stroke: rgba(255, 255, 255, 0.08); }
    .ring .bar { stroke: url(#grad); stroke-dasharray: 703.7; stroke-dashoffset: 0; transition: stroke-dashoffset 0.4s linear; filter: drop-shadow(0 0 10px var(--accent)); }
    .time {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 62px;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .controls { display: flex; justify-content: center; gap: 14px; }
    .controls button {
      min-width: 56px;
      height: 56px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, background 0.3s;
    }
    .controls button:hover { background: rgba(255, 255, 255, 0.14); }
    .controls button:active { transform: scale(0.94); }
    .controls .main { min-width: 140px; border: 0; color: #04101a; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .controls .main:hover { filter: brightness(1.1); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .stats { margin-top: 24px; display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); transition: background 0.4s, box-shadow 0.4s; }
    .dots i.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .hint { margin-top: 14px; font-size: 12px; color: var(--muted); opacity: 0.7; }
    kbd { padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.1); font-family: inherit; }
    @media (prefers-reduced-motion: reduce) { .aurora span { animation: none; } }
  </style>
</head>
<body data-mode="focus">
  <div class="aurora"><span></span><span></span><span></span></div>
  <main class="card">
    <h1>Aurora Focus</h1>
    <div class="modes" role="group" aria-label="Режим">
      <button type="button" data-mode="focus" aria-pressed="true">Фокус</button>
      <button type="button" data-mode="short" aria-pressed="false">Перерыв</button>
      <button type="button" data-mode="long" aria-pressed="false">Отдых</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" id="g1" stop-color="#3ee8b5"/>
            <stop offset="1" id="g2" stop-color="#3ec3e8"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="120" cy="120" r="112"/>
        <circle class="bar" id="bar" cx="120" cy="120" r="112"/>
      </svg>
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
    </div>
    <div class="controls">
      <button type="button" id="reset" aria-label="Сбросить">↺</button>
      <button type="button" class="main" id="toggle">Старт</button>
      <button type="button" id="skip" aria-label="Пропустить">⏭</button>
    </div>
    <div class="stats"><span>Сессии:</span><span class="dots" id="dots"></span></div>
    <p class="hint"><kbd>Пробел</kbd> — старт / пауза</p>
  </main>
  <script>
    const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
    const COLORS = { focus: ['#3ee8b5', '#3ec3e8'], short: ['#3ec3e8', '#7a5cff'], long: ['#b05cff', '#ff5cae'] };
    const CIRC = 2 * Math.PI * 112;
    const $ = (id) => document.getElementById(id);
    const bar = $('bar');
    bar.style.strokeDasharray = CIRC;

    let mode = 'focus';
    let total = DURATIONS.focus;
    let left = total;
    let endAt = 0;
    let timer = null;
    let done = Number(localStorage.getItem('af-done') || 0) % 4;

    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

    const render = () => {
      $('time').textContent = fmt(left);
      bar.style.strokeDashoffset = CIRC * (1 - left / total);
      document.title = (timer ? fmt(left) + ' · ' : '') + 'Aurora Focus';
      $('toggle').textContent = timer ? 'Пауза' : (left < total ? 'Продолжить' : 'Старт');
      $('dots').innerHTML = [0, 1, 2, 3].map((i) => '<i class="' + (i < done ? 'on' : '') + '"></i>').join('');
    };

    const stop = () => { clearInterval(timer); timer = null; };

    const setMode = (m) => {
      stop();
      mode = m;
      total = left = DURATIONS[m];
      document.body.dataset.mode = m;
      $('g1').setAttribute('stop-color', COLORS[m][0]);
      $('g2').setAttribute('stop-color', COLORS[m][1]);
      document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
      render();
    };

    const beep = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [660, 880, 1320].forEach((f, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.18);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.4);
          o.connect(g).connect(ctx.destination);
          o.start(ctx.currentTime + i * 0.18);
          o.stop(ctx.currentTime + i * 0.18 + 0.4);
        });
      } catch (e) { /* звук недоступен */ }
    };

    const finish = () => {
      stop();
      beep();
      if (mode === 'focus') {
        done += 1;
        localStorage.setItem('af-done', done);
        const long = done >= 4;
        if (long) { done = 0; localStorage.setItem('af-done', 0); }
        setMode(long ? 'long' : 'short');
      } else {
        setMode('focus');
      }
    };

    const tick = () => {
      left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      render();
      if (left <= 0) finish();
    };

    const toggle = () => {
      if (timer) { stop(); render(); return; }
      endAt = Date.now() + left * 1000;
      timer = setInterval(tick, 250);
      render();
    };

    $('toggle').addEventListener('click', toggle);
    $('reset').addEventListener('click', () => setMode(mode));
    $('skip').addEventListener('click', finish);
    document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
    });
    render();
  </script>
</body>
</html>
